<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Wi-Fi da casa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f2f2; color: #111;
  }
  .card {
    width: min(420px, 100%); background: white; border-radius: 28px; padding: 30px 24px;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.10);
  }
  .icon { font-size: 46px; margin-bottom: 8px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .subtitle { margin: 0 0 24px; color: #666; font-size: 15px; }
  .network {
    display: inline-block; padding: 10px 16px; border-radius: 999px;
    background: #f0f0f0; font-weight: 700; margin-bottom: 22px;
  }
  .qr {
    width: min(300px, 82vw); height: auto; border-radius: 14px; display: block; margin: 0 auto 20px;
  }
  .hint { margin: 0; color: #555; font-size: 14px; line-height: 1.5; }
</style>
</head>

  <main class="card">
